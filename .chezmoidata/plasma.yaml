# Réglages Plasma réellement modifiés (repris de nixos-config, plasma-manager), appliqués par
# run_onchange_after_plasma.sh.tmpl avec kwriteconfig. Seulement les clés changées, jamais des
# fichiers rc complets. groups : du plus externe au plus interne. hosts : restreint à ces
# machines. arch_laptop : restreint aux laptops sous Arch (hostnamectl chassis), où arch-config pose
# le swapfile d'hibernation. « ~ » dans value est remplacé par le home.
plasma:
  # Thème clair/sombre automatique (ce qui fait basculer kitty, et donc fish, starship…).
  - {file: kdeglobals, groups: [KDE], key: AutomaticLookAndFeel, value: "true", type: bool}
  - {file: kdeglobals, groups: [KDE], key: AutomaticLookAndFeelOnIdle, value: "false", type: bool}
  # kitty comme terminal par défaut : Plasma 6 lit TerminalService, Plasma 5 TerminalApplication.
  - {file: kdeglobals, groups: [General], key: TerminalApplication, value: kitty}
  - {file: kdeglobals, groups: [General], key: TerminalService, value: kitty.desktop}
  # Alt+Tab : fenêtres de l'application courante, en grandes icônes.
  - {file: kwinrc, groups: [TabBox], key: ApplicationsMode, value: "1"}
  - {file: kwinrc, groups: [TabBox], key: HighlightWindows, value: "false", type: bool}
  - {file: kwinrc, groups: [TabBox], key: LayoutName, value: big_icons}
  # Raccourcis : Meta seul ouvrait le lanceur par accident (Alt+F1 le fait toujours).
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate application launcher, value: "Alt+F1,,"}
  # Meta+Tab : la vue d'ensemble le prend (Karousel, plus bas) ; Alt+Tab reste aux fenêtres de l'appli.
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows (Reverse), value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows of Current Application Alternative, value: "Alt+Tab,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows of Current Application Alternative (Reverse), value: "Alt+Shift+Tab,,"}
  # Baloo indexait le montage FUSE pCloud (1,6 To), et bloquait la mise en veille.
  - {file: baloofilerc, groups: [General], key: exclude folders, value: "~/pCloudDrive/"}
  # Laptop, derrière le KVM : capot fermé sur secteur, ne rien faire ; veille puis hibernation.
  - {file: powerdevilrc, groups: [AC, SuspendAndShutdown], key: LidAction, value: "0", arch_laptop: true}
  - {file: powerdevilrc, groups: [AC, SuspendAndShutdown], key: SleepMode, value: "3", arch_laptop: true}
  - {file: powerdevilrc, groups: [Battery, SuspendAndShutdown], key: SleepMode, value: "3", arch_laptop: true}
  - {file: powerdevilrc, groups: [LowBattery, SuspendAndShutdown], key: SleepMode, value: "3", arch_laptop: true}
  # Défilement naturel et tap pour cliquer sur le pavé tactile. Groupe propre au périphérique (identifiants USB et nom) :
  # le relever dans kcminputrc après l'avoir coché une fois dans l'interface.
  - {file: kcminputrc, groups: [Libinput, "2362", "4931", "PIXA3854:00 093A:1343 Touchpad"], key: NaturalScroll, value: "true", type: bool, hosts: [framework-gab]}
  - {file: kcminputrc, groups: [Libinput, "2362", "4931", "PIXA3854:00 093A:1343 Touchpad"], key: TapToClick, value: "true", type: bool, hosts: [framework-gab]}
  # Pas de son au branchement de périphériques (USB, écrans derrière le KVM) : popup seule.
  - {file: plasma_workspace.notifyrc, groups: [Event/deviceAdded], key: Action, value: Popup}
  - {file: plasma_workspace.notifyrc, groups: [Event/deviceRemoved], key: Action, value: Popup}
  # Ni son ni notification au passage secteur/batterie ; lowbattery et criticalbattery gardent les leurs.
  - {file: powerdevil.notifyrc, groups: [Event/pluggedin], key: Action, value: ""}
  - {file: powerdevil.notifyrc, groups: [Event/unplugged], key: Action, value: ""}
  # Dossiers ouverts par Dolphin : sans défaut, xdg-mime répondait kitty. mimeapps.list est aussi
  # écrit par les applis : seulement cette clé.
  - {file: mimeapps.list, groups: [Default Applications], key: inode/directory, value: org.kde.dolphin.desktop, hosts: [desktop-gab, framework-gab]}
  # Karousel (tiling défilant, installé par .chezmoiexternal : v0.18+ sur Arch, v0.7.2 sous Plasma 5 au
  # bureau ; une action absente d'une version y est sans effet) et Plasma autour, sur toutes les machines Plasma. Convention de niri pour l'Ergo-L : OSEN = haut gauche bas droite, Ctrl = déplacer,
  # Alt = taille. KWin stocke un symbole « shifté » sans Shift : Mod+Shift+& → Meta+1, Mod+Shift+;
  # → Meta+. Valeurs « actif,, » : kglobalaccel complète défaut et libellé. Tabulation entre deux
  # touches d'une même action. Effet à la session suivante (kglobalaccel, et Karousel ne relit
  # sa config qu'au chargement du script).
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-up, value: "Meta+O\tMeta+Up,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-left, value: "Meta+S\tMeta+Left,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-down, value: "Meta+E\tMeta+Down,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-right, value: "Meta+N\tMeta+Right,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-move-up, value: "Meta+Ctrl+O,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-move-down, value: "Meta+Ctrl+E,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-left, value: "Meta+Ctrl+S,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-right, value: "Meta+Ctrl+N,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-move-left, value: "Meta+.,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-move-right, value: "Meta+\\,,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-to-previous-desktop, value: "Meta+Ctrl+W\tMeta+Ctrl+PgUp,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-to-next-desktop, value: "Meta+Ctrl+F\tMeta+Ctrl+PgDown,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-width-decrease, value: "Meta+Alt+S,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-width-increase, value: "Meta+Alt+N,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-height-increase-up, value: "Meta+Alt+O,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-height-increase-down, value: "Meta+Alt+E,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-width-maximize, value: "Meta+X,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-grid-scroll-focused, value: "Meta+Z,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-toggle-stacked, value: "Meta+B,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-window-toggle-floating, value: "Meta+Ctrl+V,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-to-desktop-1, value: "Meta+Ctrl+1\tMeta+Ctrl+Shift+F1,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-to-desktop-2, value: "Meta+Ctrl+2\tMeta+Ctrl+Shift+F2,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-to-desktop-3, value: "Meta+Ctrl+3\tMeta+Ctrl+Shift+F3,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-column-move-to-desktop-4, value: "Meta+Ctrl+4\tMeta+Ctrl+Shift+F4,,"}
  # Défauts de Karousel en ZQSD ou sur Meta+chiffre (bureaux) : désactivés.
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-columns-squeeze-left, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-columns-squeeze-right, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-grid-scroll-left-column, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-grid-scroll-right-column, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-1, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-2, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-3, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-4, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-5, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-6, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-7, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-8, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: karousel-focus-9, value: "none,,"}
  # KWin : bureaux, plein écran, maximiser (bascule), fermer ; place libérée pour Karousel.
  - {file: kglobalshortcutsrc, groups: [kwin], key: Overview, value: "Meta+Tab,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Previous Desktop, value: "Meta+W\tMeta+PgUp,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Next Desktop, value: "Meta+F\tMeta+PgDown,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Fullscreen, value: "Meta+Shift+X,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Maximize, value: "Meta+M,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Close, value: "Alt+F4\tMeta+Q,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 1, value: "Ctrl+F1\tMeta+1\tMeta+F1,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 2, value: "Ctrl+F2\tMeta+2\tMeta+F2,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 3, value: "Ctrl+F3\tMeta+3\tMeta+F3,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 4, value: "Ctrl+F4\tMeta+4\tMeta+F4,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Edit Tiles, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Show Desktop, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Minimize, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Top, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Left, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Bottom, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Right, value: "none,,"}
  # plasmashell, powerdevil et applis : conflits avec les raccourcis ci-dessus.
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 1, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 2, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 3, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 4, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate next task manager entry, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate previous task manager entry, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: manage activities, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [org_kde_powerdevil], key: powerProfile, value: "Battery,,"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.krunner.desktop], key: _launch, value: "Alt+Space\tAlt+F2\tSearch\tMeta+D"}
  - {file: kglobalshortcutsrc, groups: [services, kitty-simple.desktop], key: _launch, value: "Meta+T"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.dolphin.desktop], key: _launch, value: "none"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.spectacle.desktop], key: RecordRegion, value: "none"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.screenreader.desktop], key: toggleScreenReader, value: "none"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.plasma.emojier.desktop], key: _launch, value: "Meta+Ctrl+.\tMeta+Ctrl+Alt+Shift+Space"}
  # Bureaux empilés verticalement ; Karousel et l'animation de ses déplacements ; largeurs de Mod+R ;
  # règles de tuilage = défauts de Karousel (config/main.xml), plus le sélecteur d'emojis en flottant.
  - {file: kwinrc, groups: [Desktops], key: Number, value: "4"}
  - {file: kwinrc, groups: [Desktops], key: Rows, value: "4"}
  - {file: kwinrc, groups: [Plugins], key: karouselEnabled, value: "true", type: bool}
  - {file: kwinrc, groups: [Plugins], key: kwin4_effect_geometry_changeEnabled, value: "true", type: bool}
  # Indicateur à l'écran du bureau atteint (script KWin livré avec Plasma).
  - {file: kwinrc, groups: [Plugins], key: desktopchangeosdEnabled, value: "true", type: bool}
  - {file: kwinrc, groups: [Script-karousel], key: presetWidths, value: "33%, 50%, 67%, 100%"}
  # Glissement horizontal à trois doigts : défile les colonnes (le vertical change de bureau, Plasma),
  # dans le sens du défilement naturel.
  - {file: kwinrc, groups: [Script-karousel], key: gestureScroll, value: "true", type: bool}
  - {file: kwinrc, groups: [Script-karousel], key: gestureScrollInvert, value: "true", type: bool}
  # Bureau (Karousel v0.7.2, Plasma 5) : ses propres défauts de règles (le nom de fenêtre y est comparé
  # tel quel, pas en expression régulière : org.kde.plasma.emojier, relevé avec queryWindowInfo), et pas d'action « colonne vers
  # le bureau voisin » : KWin y déplace la fenêtre, que Karousel retuile en arrivant.
  - {file: kwinrc, groups: [Script-karousel], key: windowRules, value: '[{"class": "ksmserver-logout-greeter", "tile": false}, {"class": "kcalc", "tile": false}, {"class": "org.kde.kcalc", "tile": false}, {"class": "kfind", "tile": true}, {"class": "org.kde.kfind", "tile": true}, {"class": "kruler", "tile": false}, {"class": "org.kde.kruler", "tile": false}, {"class": "krunner", "tile": false}, {"class": "org.kde.krunner", "tile": false}, {"class": "yakuake", "tile": false}, {"class": "org.kde.yakuake", "tile": false}, {"class": "zoom", "caption": "Zoom Cloud Meetings|zoom|zoom <2>", "tile": false}, {"class": "jetbrains-idea", "caption": "splash", "tile": false}, {"class": "jetbrains-studio", "caption": "splash", "tile": false}, {"class": "jetbrains-idea", "caption": "Unstash Changes|Paths Affected by stash@.*", "tile": true}, {"class": "jetbrains-studio", "caption": "Unstash Changes|Paths Affected by stash@.*", "tile": true}, {"class": "org.kde.plasma.emojier", "tile": false}]', work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window One Desktop Up, value: "Meta+Ctrl+W\tMeta+Ctrl+PgUp\tMeta+Ctrl+Shift+Up,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window One Desktop Down, value: "Meta+Ctrl+F\tMeta+Ctrl+PgDown\tMeta+Ctrl+Shift+Down,,", work_desktop: true}
  # Plasma 5 (bureau) : les raccourcis des applis sont dans un groupe par appli, sans le préfixe
  # [services] de Plasma 6 (les lignes [services] ci-dessus y sont sans effet), et le lecteur d'écran
  # dans kaccess. Valeurs complètes « actif,défaut,libellé », comme Plasma 5 les écrit.
  - {file: kglobalshortcutsrc, groups: [org.kde.krunner.desktop], key: _launch, value: "Alt+Space\tAlt+F2\tSearch\tMeta+D,Alt+Space\tAlt+F2\tSearch,KRunner", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kitty-simple.desktop], key: _k_friendly_name, value: "kitty (sans herdr)", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kitty-simple.desktop], key: _launch, value: "Meta+T,none,kitty (sans herdr)", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [org.kde.dolphin.desktop], key: _launch, value: "none,Meta+E,Dolphin", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [org.kde.plasma.emojier.desktop], key: _launch, value: "Meta+Ctrl+.,Meta+.,Emoji Selector", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kaccess], key: Toggle Screen Reader On and Off, value: "none,Meta+Alt+S,Toggle Screen Reader On and Off", work_desktop: true}
  # Meta seul : Plasma 5 ouvre le lanceur par KWin (ModifierOnlyShortcuts), indépendamment du raccourci
  # du lanceur (Alt+F1, plus haut) ; une valeur vide le désactive.
  - {file: kwinrc, groups: [ModifierOnlyShortcuts], key: Meta, value: "", work_desktop: true}
  # Arch (Karousel v0.18+) :
  - {file: kwinrc, groups: [Script-karousel], key: windowRules, value: '[{"class": "(org\\.kde\\.)?plasmashell", "tile": false}, {"class": "(org\\.kde\\.)?polkit-kde-authentication-agent-1", "tile": false}, {"class": "(org\\.kde\\.)?kded6", "tile": false}, {"class": "(org\\.kde\\.)?kcalc", "tile": false}, {"class": "(org\\.kde\\.)?kfind", "tile": true}, {"class": "(org\\.kde\\.)?kruler", "tile": false}, {"class": "(org\\.kde\\.)?krunner", "tile": false}, {"class": "(org\\.kde\\.)?yakuake", "tile": false}, {"class": "wl-copy|wl-paste", "caption": "wl-clipboard", "tile": false}, {"class": "steam", "caption": "Steam Big Picture Mode", "tile": false}, {"class": "zoom", "caption": "Zoom Cloud Meetings|zoom|zoom <2>", "tile": false}, {"class": "jetbrains-.*", "caption": "splash", "tile": false}, {"class": "jetbrains-.*", "caption": "Unstash Changes|Paths Affected by stash@.*", "tile": true}, {"class": "(org\\.kde\\.)?plasma[.-]emojier", "tile": false}]', arch_desktop: true}
  # Spectacle : se ferme après Ctrl+C sur une sélection (menu Options).
  - {file: spectaclerc, groups: [GuiConfig], key: quitAfterSaveCopyExport, value: "true", type: bool}
  # Bouton « clé » (YubiKey) sur le verrou de Plasma 6.8 : service PAM kde-u2f, posé par arch-config.
  - {file: kscreenlockerrc, groups: [Authenticators], key: Universal2Factor, value: "true", type: bool, arch_desktop: true}
