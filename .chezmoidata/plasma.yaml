# Réglages Plasma réellement modifiés (repris de nixos-config, plasma-manager), appliqués par
# run_onchange_after_plasma.sh.tmpl avec kwriteconfig. Seulement les clés changées, jamais des
# fichiers rc complets. groups : du plus externe au plus interne. hosts : restreint à ces
# machines. arch_laptop : restreint aux laptops sous Arch (hostnamectl chassis), où arch-config pose
# le swapfile d'hibernation. « ~ » dans value est remplacé par le home.
plasma:
  # Thème clair/sombre automatique (ce qui fait basculer kitty, et donc fish, starship…).
  - {file: kdeglobals, groups: [KDE], key: AutomaticLookAndFeel, value: "true", type: bool}
  - {file: kdeglobals, groups: [KDE], key: AutomaticLookAndFeelOnIdle, value: "false", type: bool}
  # kitty comme terminal par défaut : Plasma 6 lit TerminalService, Plasma 5 TerminalApplication.
  - {file: kdeglobals, groups: [General], key: TerminalApplication, value: kitty}
  - {file: kdeglobals, groups: [General], key: TerminalService, value: kitty.desktop}
  # Alt+Tab : fenêtres de l'application courante, en grandes icônes.
  - {file: kwinrc, groups: [TabBox], key: ApplicationsMode, value: "1"}
  - {file: kwinrc, groups: [TabBox], key: HighlightWindows, value: "false", type: bool}
  - {file: kwinrc, groups: [TabBox], key: LayoutName, value: big_icons}
  # Raccourcis : Meta seul ouvrait le lanceur par accident (Alt+F1 le fait toujours).
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate application launcher, value: "Alt+F1,,"}
  # Meta+Tab : la vue d'ensemble le prend (plus bas) ; Alt+Tab reste aux fenêtres de l'appli.
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows (Reverse), value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows of Current Application Alternative, value: "Alt+Tab,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Walk Through Windows of Current Application Alternative (Reverse), value: "Alt+Shift+Tab,,"}
  # Baloo indexait le montage FUSE pCloud (1,6 To), et bloquait la mise en veille.
  - {file: baloofilerc, groups: [General], key: exclude folders, value: "~/pCloudDrive/"}
  # Laptop, derrière le KVM : capot fermé sur secteur, ne rien faire ; veille puis hibernation.
  - {file: powerdevilrc, groups: [AC, SuspendAndShutdown], key: LidAction, value: "0", arch_laptop: true}
  - {file: powerdevilrc, groups: [AC, SuspendAndShutdown], key: SleepMode, value: "3", arch_laptop: true}
  - {file: powerdevilrc, groups: [Battery, SuspendAndShutdown], key: SleepMode, value: "3", arch_laptop: true}
  - {file: powerdevilrc, groups: [LowBattery, SuspendAndShutdown], key: SleepMode, value: "3", arch_laptop: true}
  # Défilement naturel et tap pour cliquer sur le pavé tactile. Groupe propre au périphérique (identifiants USB et nom) :
  # le relever dans kcminputrc après l'avoir coché une fois dans l'interface.
  - {file: kcminputrc, groups: [Libinput, "2362", "4931", "PIXA3854:00 093A:1343 Touchpad"], key: NaturalScroll, value: "true", type: bool, hosts: [framework-gab]}
  - {file: kcminputrc, groups: [Libinput, "2362", "4931", "PIXA3854:00 093A:1343 Touchpad"], key: TapToClick, value: "true", type: bool, hosts: [framework-gab]}
  # Pas de son au branchement de périphériques (USB, écrans derrière le KVM) : popup seule.
  - {file: plasma_workspace.notifyrc, groups: [Event/deviceAdded], key: Action, value: Popup}
  - {file: plasma_workspace.notifyrc, groups: [Event/deviceRemoved], key: Action, value: Popup}
  # Ni son ni notification au passage secteur/batterie ; lowbattery et criticalbattery gardent les leurs.
  - {file: powerdevil.notifyrc, groups: [Event/pluggedin], key: Action, value: ""}
  - {file: powerdevil.notifyrc, groups: [Event/unplugged], key: Action, value: ""}
  # Dossiers ouverts par Dolphin : sans défaut, xdg-mime répondait kitty. mimeapps.list est aussi
  # écrit par les applis : seulement cette clé.
  - {file: mimeapps.list, groups: [Default Applications], key: inode/directory, value: org.kde.dolphin.desktop, hosts: [desktop-gab, framework-gab]}
  # Krohnkite (tiling automatique façon dwm, installé par .chezmoiexternal : 0.9+ sur Arch, 0.8.1 sous
  # Plasma 5 au bureau) et Plasma autour, sur toutes les machines Plasma. Convention de niri pour l'Ergo-L :
  # OSEN = haut gauche bas droite, Ctrl = déplacer, Alt = taille. KWin stocke un symbole « shifté » sans
  # Shift : Mod+Shift+& → Meta+1, Mod+Shift+; → Meta+. Valeurs « actif,, » : kglobalaccel complète défaut
  # et libellé. Tabulation entre deux touches d'une même action. Effet à la session suivante (kglobalaccel,
  # et Krohnkite ne relit sa config qu'au chargement du script). Les noms d'actions diffèrent entre 0.8.1
  # (« Krohnkite: <libellé> ») et 0.9 (KrohnkiteXxx) : un jeu par version, mêmes touches. Les défauts de
  # Krohnkite pris par d'autres raccourcis (Meta+T kitty, Meta+M maximiser, Meta+F bureau, Meta+D
  # KRunner, Meta+L verrou, Meta+./, focus suivant/précédent en 0.9) sont tous réaffectés ici.
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteFocusUp, value: "Meta+O\tMeta+Up,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteFocusLeft, value: "Meta+S\tMeta+Left,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteFocusDown, value: "Meta+E\tMeta+Down,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteFocusRight, value: "Meta+N\tMeta+Right,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteShiftUp, value: "Meta+Ctrl+O,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteShiftLeft, value: "Meta+Ctrl+S,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteShiftDown, value: "Meta+Ctrl+E,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteShiftRight, value: "Meta+Ctrl+N,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteShrinkHeight, value: "Meta+Alt+O,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteShrinkWidth, value: "Meta+Alt+S,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteGrowHeight, value: "Meta+Alt+E,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkitegrowWidth, value: "Meta+Alt+N,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteIncrease, value: "Meta+.,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteDecrease, value: "Meta+\\,,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteMonocleLayout, value: "Meta+X,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteNextLayout, value: "Meta+B,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkitePreviousLayout, value: "Meta+Shift+B,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteToggleFloat, value: "Meta+Ctrl+V,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteTileLayout, value: "none,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteFocusNext, value: "none,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: KrohnkiteFocusPrev, value: "none,,", arch_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Up/Prev", value: "Meta+O\tMeta+Up,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Left", value: "Meta+S\tMeta+Left,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Down/Next", value: "Meta+E\tMeta+Down,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Right", value: "Meta+N\tMeta+Right,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Move Up/Prev", value: "Meta+Ctrl+O,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Move Left", value: "Meta+Ctrl+S,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Move Down/Next", value: "Meta+Ctrl+E,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Move Right", value: "Meta+Ctrl+N,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Shrink Height", value: "Meta+Alt+O,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Shrink Width", value: "Meta+Alt+S,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Grow Height", value: "Meta+Alt+E,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Grow Width", value: "Meta+Alt+N,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Increase", value: "Meta+.,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Decrease", value: "Meta+\\,,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Monocle Layout", value: "Meta+X,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Next Layout", value: "Meta+B,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Previous Layout", value: "Meta+Shift+B,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Float", value: "Meta+Ctrl+V,,", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kwin], key: "Krohnkite: Tile Layout", value: "none,,", work_desktop: true}
  # Krohnkite n'envoie pas de fenêtre sur un autre bureau : actions de KWin, il la retuile en arrivant.
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window One Desktop Up, value: "Meta+Ctrl+W\tMeta+Ctrl+PgUp\tMeta+Ctrl+Shift+Up,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window One Desktop Down, value: "Meta+Ctrl+F\tMeta+Ctrl+PgDown\tMeta+Ctrl+Shift+Down,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window to Desktop 1, value: "Meta+Ctrl+1\tMeta+Ctrl+Shift+F1,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window to Desktop 2, value: "Meta+Ctrl+2\tMeta+Ctrl+Shift+F2,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window to Desktop 3, value: "Meta+Ctrl+3\tMeta+Ctrl+Shift+F3,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window to Desktop 4, value: "Meta+Ctrl+4\tMeta+Ctrl+Shift+F4,,"}
  # KWin : bureaux, plein écran, maximiser (bascule), fermer ; place libérée pour Krohnkite.
  - {file: kglobalshortcutsrc, groups: [kwin], key: Overview, value: "Meta+Tab,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Previous Desktop, value: "Meta+W\tMeta+PgUp,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Next Desktop, value: "Meta+F\tMeta+PgDown,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Fullscreen, value: "Meta+Shift+X,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Maximize, value: "Meta+M,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Close, value: "Alt+F4\tMeta+Q,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 1, value: "Ctrl+F1\tMeta+1\tMeta+F1,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 2, value: "Ctrl+F2\tMeta+2\tMeta+F2,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 3, value: "Ctrl+F3\tMeta+3\tMeta+F3,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Switch to Desktop 4, value: "Ctrl+F4\tMeta+4\tMeta+F4,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Edit Tiles, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Show Desktop, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Minimize, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Top, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Left, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Bottom, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [kwin], key: Window Quick Tile Right, value: "none,,"}
  # plasmashell, powerdevil et applis : conflits avec les raccourcis ci-dessus.
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 1, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 2, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 3, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate task manager entry 4, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate next task manager entry, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: activate previous task manager entry, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: manage activities, value: "none,,"}
  - {file: kglobalshortcutsrc, groups: [org_kde_powerdevil], key: powerProfile, value: "Battery,,"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.krunner.desktop], key: _launch, value: "Alt+Space\tAlt+F2\tSearch\tMeta+D"}
  - {file: kglobalshortcutsrc, groups: [services, kitty-simple.desktop], key: _launch, value: "Meta+T"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.dolphin.desktop], key: _launch, value: "none"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.spectacle.desktop], key: RecordRegion, value: "none"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.screenreader.desktop], key: toggleScreenReader, value: "none"}
  - {file: kglobalshortcutsrc, groups: [services, org.kde.plasma.emojier.desktop], key: _launch, value: "Meta+Ctrl+.\tMeta+Ctrl+Alt+Shift+Space"}
  # Bureaux empilés verticalement ; Krohnkite et l'animation des déplacements de fenêtres.
  - {file: kwinrc, groups: [Desktops], key: Number, value: "4"}
  - {file: kwinrc, groups: [Desktops], key: Rows, value: "4"}
  - {file: kwinrc, groups: [Plugins], key: krohnkiteEnabled, value: "true", type: bool}
  - {file: kwinrc, groups: [Plugins], key: kwin4_effect_geometry_changeEnabled, value: "true", type: bool}
  # Minimiser : Magic Lamp plutôt que Squash, que Krohnkite ne supporte pas (wiki, Tips). Plasma 5 nomme
  # l'effet kwin4_effect_squash, Plasma 6 squash : la clé de l'autre version est sans effet.
  - {file: kwinrc, groups: [Plugins], key: kwin4_effect_squashEnabled, value: "false", type: bool}
  - {file: kwinrc, groups: [Plugins], key: squashEnabled, value: "false", type: bool}
  - {file: kwinrc, groups: [Plugins], key: magiclampEnabled, value: "true", type: bool}
  # Pas d'indicateur à l'écran du bureau atteint (script KWin livré avec Plasma).
  - {file: kwinrc, groups: [Plugins], key: desktopchangeosdEnabled, value: "false", type: bool}
  # Flottantes : le sélecteur d'emojis, kcalc, zenity et KeePassXC (sa fenêtre ne descend pas sous ~530 px
  # de haut, et ne s'ouvre que pour une demande : elle vit dans la zone de notification, plus bas). Krohnkite fait déjà flotter les fenêtres non
  # normales (dialogues, splash) et ignore plasmashell, krunner, yakuake, spectacle. 0.8.1 : liste de
  # classes ; 0.9 : une règle par ligne (classes[:titre][:paramètres]), ici une seule ligne de classes.
  - {file: kwinrc, groups: [Script-krohnkite], key: floatingClass, value: "org.kde.plasma.emojier,kcalc,org.kde.kcalc,zenity,org.keepassxc.KeePassXC", work_desktop: true}
  - {file: kwinrc, groups: [Script-krohnkite], key: floatConfig, value: "org.kde.plasma.emojier,plasma-emojier,kcalc,org.kde.kcalc,zenity,org.keepassxc.KeePassXC", arch_desktop: true}
  # 0.9 choisit la fenêtre visée par le focus directionnel avec les géométries KWin. À l'échelle
  # fractionnaire et sans espacement, les tuiles voisines se chevauchent de moins d'un pixel : depuis le
  # bas de la pile, Mod+O allait au master au lieu de la fenêtre du dessus (11/11/2026). 2 px y suffisent.
  - {file: kwinrc, groups: [Script-krohnkite], key: screenGapBetween, value: "2", arch_desktop: true}
  # 0.8.1 : Meta+gauche/droite déplacent par défaut la frontière master/pile (mode dwm) ; ici le focus,
  # comme en 0.9.
  - {file: kwinrc, groups: [Script-krohnkite], key: directionalKeyDwm, value: "false", type: bool, work_desktop: true}
  # 0.8.1 n'ignore plasmashell que sous son nom X11 ; sous Wayland c'est org.kde.plasmashell, dont le
  # popup du presse-papiers (Mod+V) est une fenêtre normale : il se pavait. Liste par défaut + celui-ci.
  - {file: kwinrc, groups: [Script-krohnkite], key: ignoreClass, value: "krunner,yakuake,spectacle,kded5,org.kde.plasmashell", work_desktop: true}
  # Plasma 5 (bureau) : les raccourcis des applis sont dans un groupe par appli, sans le préfixe
  # [services] de Plasma 6 (les lignes [services] ci-dessus y sont sans effet), et le lecteur d'écran
  # dans kaccess. Valeurs complètes « actif,défaut,libellé », comme Plasma 5 les écrit.
  - {file: kglobalshortcutsrc, groups: [org.kde.krunner.desktop], key: _launch, value: "Alt+Space\tAlt+F2\tSearch\tMeta+D,Alt+Space\tAlt+F2\tSearch,KRunner", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kitty-simple.desktop], key: _k_friendly_name, value: "kitty (sans herdr)", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kitty-simple.desktop], key: _launch, value: "Meta+T,none,kitty (sans herdr)", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [org.kde.dolphin.desktop], key: _launch, value: "none,Meta+E,Dolphin", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [org.kde.plasma.emojier.desktop], key: _launch, value: "Meta+Ctrl+.,Meta+.,Emoji Selector", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [kaccess], key: Toggle Screen Reader On and Off, value: "none,Meta+Alt+S,Toggle Screen Reader On and Off", work_desktop: true}
  # Plasma 5 (bureau) : raccourcis par défaut en conflit, qui prenaient Mod+Ctrl+S/N/F/1/2
  # (tablette Wacom) et Mod+S (arrêter l'activité). Libellés tels que Plasma 5 les écrit.
  - {file: kglobalshortcutsrc, groups: [wacomtablet], key: Toggle stylus mode, value: "none,Meta+Ctrl+S,Basculer entre l'état relatif / absolu de l'outil stylet", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [wacomtablet], key: Next Profile, value: "none,Meta+Ctrl+N,Profil suivant", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [wacomtablet], key: Map to fullscreen, value: "none,Meta+Ctrl+F,Faire correspondre avec le plein écran", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [wacomtablet], key: Map to screen 1, value: "none,Meta+Ctrl+1,Faire correspondre avec l'écran 1", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [wacomtablet], key: Map to screen 2, value: "none,Meta+Ctrl+2,Faire correspondre avec l'écran 2", work_desktop: true}
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: stop current activity, value: "none,Meta+S,Stop Current Activity", work_desktop: true}
  # Meta seul : Plasma 5 ouvre le lanceur par KWin (ModifierOnlyShortcuts), indépendamment du raccourci
  # du lanceur (Alt+F1, plus haut) ; une valeur vide le désactive.
  - {file: kwinrc, groups: [ModifierOnlyShortcuts], key: Meta, value: "", work_desktop: true}
  # Règles de fenêtre KWin. count et rules listent toutes les règles : une règle créée dans les Réglages
  # en serait retirée, à versionner ici.
  - {file: kwinrulesrc, groups: [General], key: count, value: "2"}
  - {file: kwinrulesrc, groups: [General], key: rules, value: "krohnkite-webex,no-class-dialog"}
  # Webex impose une taille minimale (834×659) plus grande qu'une place de la pile de Krohnkite, et
  # débordait sur ses voisines ; forcée à 1×1.
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: Description, value: "Webex : taille minimale libre pour Krohnkite"}
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: wmclass, value: webex}
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: wmclassmatch, value: "1"}
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: wmclasscomplete, value: "false", type: bool}
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: types, value: "1"}
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: minsize, value: "1,1"}
  - {file: kwinrulesrc, groups: [krohnkite-webex], key: minsizerule, value: "2"}
  # KeePassXC dans la zone de notification : il doit tourner pour l'extension navigateur, sans fenêtre
  # dans le pavage ; il la rouvre de lui-même pour une demande d'accès ou un déverrouillage.
  - {file: keepassxc/keepassxc.ini, groups: [GUI], key: ShowTrayIcon, value: "true", type: bool}
  - {file: keepassxc/keepassxc.ini, groups: [GUI], key: MinimizeOnClose, value: "true", type: bool}
  - {file: keepassxc/keepassxc.ini, groups: [GUI], key: MinimizeOnStartup, value: "true", type: bool}
  # Fenêtres sans classe : les aperçus d'image de Webex (X11, titrées du nom du fichier, sans WM_CLASS ni
  # WM_TRANSIENT_FOR), que Krohnkite pavait. Forcées en dialogue, qu'il laisse flotter. La classe vide en
  # correspondance exacte n'attrape que les fenêtres qui n'en ont aucune.
  - {file: kwinrulesrc, groups: [no-class-dialog], key: Description, value: "Fenêtres sans classe (aperçus d'image de Webex) : dialogue, flottant dans Krohnkite"}
  - {file: kwinrulesrc, groups: [no-class-dialog], key: wmclass, value: ""}
  - {file: kwinrulesrc, groups: [no-class-dialog], key: wmclassmatch, value: "1"}
  - {file: kwinrulesrc, groups: [no-class-dialog], key: wmclasscomplete, value: "false", type: bool}
  - {file: kwinrulesrc, groups: [no-class-dialog], key: types, value: "1"}
  - {file: kwinrulesrc, groups: [no-class-dialog], key: type, value: "5"}
  - {file: kwinrulesrc, groups: [no-class-dialog], key: typerule, value: "2"}
  # Mod+V : le presse-papiers de la zone de notification (raccourci posé par plasma-settings), pas le menu de
  # Klipper sous le curseur, une fenêtre que KWin ne sait pas placer.
  - {file: kglobalshortcutsrc, groups: [plasmashell], key: show-on-mouse-pos, value: "none,,"}
  # Spectacle : se ferme après Ctrl+C sur une sélection (menu Options).
  - {file: spectaclerc, groups: [GuiConfig], key: quitAfterSaveCopyExport, value: "true", type: bool}
  # Bouton « clé » (YubiKey) sur le verrou de Plasma 6.8 : service PAM kde-u2f, posé par arch-config.
  - {file: kscreenlockerrc, groups: [Authenticators], key: Universal2Factor, value: "true", type: bool, arch_desktop: true}
