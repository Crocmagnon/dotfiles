# KRunner démarre parfois avec la session, avant que Plasma ait transmis WAYLAND_DISPLAY à systemd :
# « Failed to create wl_display », abandon, unité en échec. Relancé 2 s plus tard, l'affichage est
# prêt. Limite par défaut de systemd : 5 démarrages en 10 s, puis abandon.
[Service]
Restart=on-failure
RestartSec=2
