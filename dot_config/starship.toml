"$schema" = "https://starship.rs/config-schema.json"
format = "$all$fill$cmd_duration$time$line_break$character"
palette = "catppuccin_latte"

[golang]
disabled = true
# symbol = 'go '
# format = '[$symbol($version )]($style)'
 
[azure]
symbol = "☁️ "
 
[battery]
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
empty_symbol = "❗ "
full_symbol = "• "
unknown_symbol = "❓ "
 
[cmd_duration]
format = "[⏱ $duration]($style) "
min_time = 5000
style = "black"
 
[directory]
before_repo_root_style = "cyan"
fish_style_pwd_dir_length = 1
repo_root_style = "bold cyan"
 
[erlang]
symbol = "ⓔ "
 
[fill]
symbol = " "
 
[git_branch]
format = "[$branch(:$remote_branch)]($style) "
only_attached = true
style = "green"
 
[git_commit]
tag_disabled = false
tag_symbol = " #"
 
[git_status]
ahead = "[⇡$count](green) "
behind = "[⇣$count](green) "
conflicted = "=$count "
deleted = "✘$count "
diverged = "[⇡$ahead_count ⇣$behind_count](green) "
format = "[$ahead_behind$all_status]($style)"
modified = "!$count "
renamed = "»$count "
staged = "+$count "
stashed = "[*$count](green) "
style = "yellow"
untracked = "[?$count](blue) "
 
[hostname]
format = "[@$hostname]($style) "
style = "dimmed yellow"
 
[nodejs]
symbol = "[⬢](bold green) "
 
