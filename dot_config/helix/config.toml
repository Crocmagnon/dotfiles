# Nom constant : conf.d/theme-auto.fish réécrit themes/catppuccin.toml (inherits latte ou
# mocha) et envoie SIGUSR1, ce qui fait relire la config à helix.
theme = "catppuccin"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "always"
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[keys.normal]
Z = { Z = ":wq" }
pageup = "half_page_up"
pagedown = "half_page_down"

[keys.select]
pageup = "half_page_up"
pagedown = "half_page_down"

[keys.insert]
pageup = "half_page_up"
pagedown = "half_page_down"
