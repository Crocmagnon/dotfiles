#!/bin/sh
# KeePassXC dans la zone de notification : il doit tourner pour l'extension navigateur, sans fenêtre
# dans le pavage ; il la rouvre de lui-même pour une demande d'accès ou un déverrouillage.
# Fichier QSettings, pas KConfig : kwriteconfig casse les valeurs échappées (\") de [KeeShare] en le
# réécrivant. On ne touche qu'aux clés voulues de [GUI] et on recopie le reste tel quel.
awk -v want='ShowTrayIcon=true MinimizeOnClose=true MinimizeOnStartup=true' '
function flush(  k) {
    for (k in val) if (!(k in done)) print k "=" val[k]
    gui = 0
}
BEGIN {
    n = split(want, kv, " ")
    for (i = 1; i <= n; i++) { split(kv[i], p, "="); val[p[1]] = p[2] }
}
/^\[/ {
    if (gui) flush()
    if ($0 == "[GUI]") { gui = 1; seen = 1 }
}
gui && index($0, "=") {
    k = substr($0, 1, index($0, "=") - 1)
    if (k in val) { print k "=" val[k]; done[k] = 1; next }
}
{ print }
END {
    if (gui) flush()
    else if (!seen) { print "[GUI]"; flush() }
}'
