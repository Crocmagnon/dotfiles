#!/bin/sh
# btop réécrit btop.conf à chaque sortie : on ne gère que color_theme et on garde le reste.
# catppuccin.theme est un lien vers latte ou mocha, posé par fish (conf.d/theme-auto.fish).
want='color_theme = "catppuccin"'
conf=$(cat)
if printf '%s\n' "$conf" | grep -q '^color_theme'; then
    printf '%s\n' "$conf" | sed "s|^color_theme.*|$want|"
else
    printf '%s\n' "$want"
    if [ -n "$conf" ]; then printf '%s\n' "$conf"; fi
fi
