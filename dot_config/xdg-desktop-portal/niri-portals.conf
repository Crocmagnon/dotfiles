# Portails sous niri. Remplace en entier /usr/share/xdg-desktop-portal/niri-portals.conf (pas de
# fusion), dont les lignes sont reprises ; seule la boîte de dialogue de fichiers change : celle de
# KDE plutôt que celle de GTK. Plasma lit kde-portals.conf, pas ce fichier.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=kde;
