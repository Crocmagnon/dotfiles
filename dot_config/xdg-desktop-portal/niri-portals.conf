# Portails sous niri. Remplace en entier /usr/share/xdg-desktop-portal/niri-portals.conf (pas de
# fusion). Le portail KDE par défaut, comme le reste du bureau (Dolphin, portefeuille KDE) ; GNOME
# seulement pour ce que le portail KDE ne fait qu'avec KWin (capture et partage d'écran : niri
# imite l'interface de Mutter) ; GTK en repli. Plasma lit kde-portals.conf, pas ce fichier.
[preferred]
default=kde;gtk;
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=gnome;
org.freedesktop.impl.portal.RemoteDesktop=gnome;
org.freedesktop.impl.portal.Secret=kwallet;
